name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducible-sample:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Keep temporary files inside the checkout
        run: |
          New-Item -ItemType Directory -Force .concordia/tmp | Out-Null
          $tempPath = Join-Path (Get-Location) '.concordia/tmp'
          "TEMP=$tempPath" >> $env:GITHUB_ENV
          "TMP=$tempPath" >> $env:GITHUB_ENV
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          NODE_OPTIONS: --require ./scripts/ci-no-services.cjs
      - name: Offline sample without credentials
        env:
          SAMPLE_MODE: 'true'
          NODE_OPTIONS: --require ./scripts/ci-no-services.cjs
        run: npm run demo -- --universe=U1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: concordia-U1-report
          path: out/U1/report.html
          if-no-files-found: error
          retention-days: 7
